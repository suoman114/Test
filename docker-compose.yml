# PKG Dashboard — 사내 배포용 compose
#
# 사전 준비:
#   cp backend/.env.example backend/.env   # BITBUCKET_* 값 채우기
#   docker compose up -d --build
#
# 접속: http://<호스트>:8080  (nginx 단일 진입점)
#   - /            → 프론트엔드(Next.js)
#   - /api, /docs  → 백엔드(FastAPI)

services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - audit-data:/app/data       # 감사 로그 SQLite 영속화
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # 브라우저 번들에 박히는 공개 API 주소. 프록시를 쓰므로 상대경로("").
        NEXT_PUBLIC_API_BASE: ""
    environment:
      # 서버 컴포넌트가 컨테이너 네트워크에서 백엔드를 호출하는 주소.
      INTERNAL_API_BASE: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  audit-data:
